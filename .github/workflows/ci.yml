name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, curl, intl, pdo, pdo_mysql
          coverage: xdebug

      - name: Copy .env BEFORE composer install
        run: |
          cp .env.test .env
          echo "✅ .env créé depuis .env.test"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create database and schema
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:create --env=test
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db

      - name: Run PHPUnit tests with coverage
        run: |
          mkdir -p var/coverage
          vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover=var/coverage/coverage.xml --log-junit=var/coverage/junit.xml
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db
      
      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v3
        with:
          files: ./var/coverage/coverage.xml
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Copy .env BEFORE composer install
        run: |
          cp .env.test .env || echo "APP_ENV=test" > .env
          echo "✅ .env créé"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Composer Audit
        run: composer audit || echo "Audit completed (warnings allowed)"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: php-cs-fixer

      - name: Copy .env (optionnel pour code-quality)
        run: |
          cp .env.test .env || echo "APP_ENV=test" > .env || true

      - name: Check PHP syntax
        run: |
          find src -name "*.php" -exec php -l {} \;

      - name: Check Twig syntax
        run: |
          composer require twig/twig --no-interaction || true
          find templates -name "*.twig" -exec php -r "require 'vendor/autoload.php'; \$loader = new \Twig\Loader\FilesystemLoader('templates'); \$twig = new \Twig\Environment(\$loader); \$twig->parse(\$twig->tokenize(new \Twig\Source(file_get_contents('{}'), '{}', '{}')));" {} \; || echo "Twig check skipped"

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [php-tests, security-audit, code-quality]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to dev server
        run: |
          echo "Deployment to dev.infpf.fr would happen here"
          echo "SSH deployment script would be executed"
          # Add your actual deployment script here

