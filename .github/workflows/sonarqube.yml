name: SonarQube Analysis

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, curl, intl, pdo, pdo_mysql
          coverage: xdebug

      - name: Copy .env
        run: |
          cp .env.test .env
          echo "APP_ENV=test" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create database and schema
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:create --env=test
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p var/coverage
          vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover=var/coverage/coverage.xml --log-junit=var/coverage/junit.xml
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true




