monolog:
    handlers:
        # Handler principal pour le développement
        main:
            type: stream
            path: '%kernel.logs_dir%/%kernel.environment%.log'
            level: debug
            formatter: monolog.formatter.json
            channels: ['!event']
            
        # Console handler pour voir les logs en direct
        console:
            type: console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console']
            
        # Logs deprecation warnings
        deprecation:
            type: stream
            path: '%kernel.logs_dir%/deprecations.log'
            level: warning
            channels: ['php']


