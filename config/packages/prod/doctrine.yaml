doctrine:
    orm:
        # Désactive la génération automatique de proxies en production
        auto_generate_proxy_classes: false
        
        # Caches optimisés avec les pools définis dans cache.yaml
        metadata_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
            
        query_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
            
        result_cache_driver:
            type: pool
            pool: doctrine.result_cache_pool

