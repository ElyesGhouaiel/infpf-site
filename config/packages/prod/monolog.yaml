monolog:
    handlers:
        # Handler principal pour les erreurs de production
        main:
            type: fingers_crossed
            action_level: error
            handler: grouped
            excluded_http_codes: [404, 405]
            buffer_size: 50
            
        # Groupement des logs par type
        grouped:
            type: group
            members: [deduplicated, sentry]
            
        # Déduplication pour éviter les doublons
        deduplicated:
            type: deduplication
            handler: file
            time: 60
            
        # Logs vers fichier
        file:
            type: stream
            path: '%kernel.logs_dir%/%kernel.environment%.log'
            level: error
            formatter: monolog.formatter.json
            
        # Logs vers Sentry
        sentry:
            type: sentry
            level: error
            hub_id: Sentry\State\HubInterface
            
        # Logs console (pour les commandes Symfony)
        console:
            type: console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console']


