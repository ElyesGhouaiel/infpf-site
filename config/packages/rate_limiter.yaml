framework:
    rate_limiter:
        # Rate limiter pour les formulaires de contact
        contact_form:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            
        # Rate limiter pour les tentatives de connexion
        login_attempts:
            policy: 'fixed_window'
            limit: 5
            interval: '5 minutes'
            
        # Rate limiter pour l'inscription
        registration:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'
            
        # Rate limiter pour les demandes de devis
        quote_request:
            policy: 'sliding_window'
            limit: 3
            interval: '30 minutes'
            
        # Rate limiter global pour prévenir les abus
        api_global:
            policy: 'token_bucket'
            limit: 100
            rate: { interval: '1 minute', amount: 10 }
