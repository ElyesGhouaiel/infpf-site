framework:
    rate_limiter:
        # Rate limiter pour les formulaires de contact
        contact_form:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            
        # Rate limiter pour l'authentification
        login:
            policy: 'fixed_window'
            limit: 5
            interval: '5 minutes'
            
        # Rate limiter pour l'API globale
        api:
            policy: 'token_bucket'
            limit: 100
            rate: { interval: '1 minute', amount: 10 }
            
        # Rate limiter strict pour prévenir le spam agressif
        strict:
            policy: 'fixed_window'
            limit: 10
            interval: '1 minute'


