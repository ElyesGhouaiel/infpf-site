sentry:
    # DSN Sentry - À configurer avec votre clé Sentry
    dsn: '%env(SENTRY_DSN)%'
    
    # Options de configuration
    options:
        # Environnement (dev, test, prod)
        environment: '%kernel.environment%'
        
        # Version de votre application
        release: '1.0.0'
        
        # Taux d'échantillonnage des traces (0.0 à 1.0)
        traces_sample_rate: 1.0
        
        # Taux d'échantillonnage des profils
        profiles_sample_rate: 1.0
        
        # Contexte utilisateur (false = ne pas envoyer de données personnelles)
        send_default_pii: false
        
        # Breadcrumbs (journalisation des événements menant à l'erreur)
        default_integrations: true
        max_breadcrumbs: 50
        
        # Capture des erreurs silencieuses
        capture_silenced_errors: false
        
        # Types d'erreurs à capturer
        error_types: E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED
        
    # Intégrations
    register_error_listener: true
    register_error_handler: true

