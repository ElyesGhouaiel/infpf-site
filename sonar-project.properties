# SonarCloud Configuration - INFPF Project

# Informations du projet
sonar.organization=elyesghouaiel
sonar.projectKey=ElyesGhouaiel_infpf-site
sonar.projectName=INFPF - Site Web
sonar.projectVersion=3.0.0

# Chemins source et tests
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/var/**,\
  **/public/bundles/**,\
  **/migrations/**,\
  **/*.js,\
  **/*.css

# Exclusions de tests
sonar.test.exclusions=\
  **/tests/**

# Encodage
sonar.sourceEncoding=UTF-8

# Langage principal
sonar.language=php

# PHP specific settings
sonar.php.version=8.1
sonar.php.coverage.reportPaths=var/coverage/coverage.xml
sonar.php.tests.reportPath=var/coverage/junit.xml

# Couverture de code
sonar.coverage.exclusions=\
  **/tests/**,\
  **/Kernel.php,\
  **/migrations/**,\
  **/config/**

# Règles de qualité
sonar.php.file.suffixes=php

# Seuils de qualité (Quality Gate)
sonar.qualitygate.wait=true

# Duplications
sonar.cpd.php.minimumTokens=50

# Issues
sonar.issue.ignore.multicriteria=e1,e2

# Ignorer les deprecations Symfony (déjà gérées)
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

# Ignorer les TODO/FIXME (déjà trackés en interne)
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S1134
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.php




